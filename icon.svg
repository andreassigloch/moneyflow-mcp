<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <!-- Background -->
  <rect width="128" height="128" rx="28" fill="#0a0e17"/>

  <!-- Flow S-curve -->
  <path d="M 20 64 C 42 30, 60 98, 82 64 C 94 47, 104 52, 112 60"
        stroke="#22d3ee" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.35"/>

  <!-- Nodes: ring + filled core -->
  <circle cx="20" cy="64" r="11" fill="#0f172a" stroke="#22d3ee" stroke-width="2.5"/>
  <circle cx="20" cy="64" r="5" fill="#22d3ee"/>

  <circle cx="66" cy="64" r="9" fill="#0f172a" stroke="#22d3ee" stroke-width="2" opacity="0.8"/>
  <circle cx="66" cy="64" r="4" fill="#22d3ee" opacity="0.8"/>

  <circle cx="112" cy="60" r="7" fill="#0f172a" stroke="#22d3ee" stroke-width="1.5" opacity="0.55"/>
  <circle cx="112" cy="60" r="3" fill="#22d3ee" opacity="0.55"/>

  <!-- Split branches from middle node -->
  <line x1="72" y1="57" x2="88" y2="40" stroke="#22d3ee" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>
  <circle cx="88" cy="40" r="3" fill="#22d3ee" opacity="0.25"/>

  <line x1="72" y1="71" x2="88" y2="88" stroke="#22d3ee" stroke-width="1.2" stroke-linecap="round" opacity="0.25"/>
  <circle cx="88" cy="88" r="2.5" fill="#22d3ee" opacity="0.2"/>
</svg>
