<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" fill="none">
  <!-- Background pill -->
  <rect width="520" height="120" rx="16" fill="#0a0e17"/>

  <!-- Flow S-curve -->
  <path d="M 32 60 C 62 24, 96 96, 140 60 C 170 36, 196 48, 210 58"
        stroke="#22d3ee" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.35"/>

  <!-- Node: State -->
  <circle cx="32" cy="60" r="13" fill="#0f172a" stroke="#22d3ee" stroke-width="2.5"/>
  <circle cx="32" cy="60" r="5.5" fill="#22d3ee"/>

  <!-- Node: Citizen -->
  <circle cx="120" cy="60" r="10" fill="#0f172a" stroke="#22d3ee" stroke-width="2" opacity="0.8"/>
  <circle cx="120" cy="60" r="4.5" fill="#22d3ee" opacity="0.8"/>

  <!-- Node: Enterprise -->
  <circle cx="210" cy="58" r="8" fill="#0f172a" stroke="#22d3ee" stroke-width="1.5" opacity="0.55"/>
  <circle cx="210" cy="58" r="3.5" fill="#22d3ee" opacity="0.55"/>

  <!-- Split branches from citizen node -->
  <line x1="127" y1="53" x2="148" y2="36" stroke="#22d3ee" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>
  <circle cx="148" cy="36" r="3" fill="#22d3ee" opacity="0.22"/>
  <line x1="127" y1="67" x2="148" y2="84" stroke="#22d3ee" stroke-width="1.2" stroke-linecap="round" opacity="0.25"/>
  <circle cx="148" cy="84" r="2.5" fill="#22d3ee" opacity="0.18"/>

  <!-- Divider line -->
  <line x1="245" y1="28" x2="245" y2="92" stroke="#1e293b" stroke-width="1"/>

  <!-- Wordmark: "money" muted, "flow" accent -->
  <text x="270" y="68" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="36" font-weight="600" letter-spacing="1">
    <tspan fill="#64748b">money</tspan><tspan fill="#22d3ee">flow</tspan>
  </text>

  <!-- Tagline -->
  <text x="270" y="88" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#475569" letter-spacing="0.5">
    follow the money
  </text>
</svg>
